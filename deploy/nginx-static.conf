# Include inside the landing HTTPS server block, alongside nginx-leads.conf.
# Set root to the deployed site directory. Replace an existing location / block.
charset utf-8;
index index.html;

gzip on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_vary on;
gzip_types text/css application/javascript application/json application/ld+json application/xml image/svg+xml text/plain;

# Content hashes change when the source changes.
location /assets/dist/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Font filenames include their version. Never replace them without a version bump.
location /assets/fonts/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location = /sitemap.xml {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
}
location = /robots.txt {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
}

# Keep source-control and environment files outside the public surface.
location ~ /\.(?!well-known/) { deny all; }

# Build tools, deploy notes and package files are not public pages.
location ~ ^/(?:tools|deploy|node_modules)(?:/|$) { return 404; }
location ~ ^/(?:README\.md|package(?:-lock)?\.json|_headers)$ { return 404; }

# One URL per page for search engines: /index.html and /erp/index.html
# redirect to the directory URL. $request_uri is the original request, so the
# internal index lookup does not loop.
if ($request_uri ~ ^([^?]*/)index\.html(?:\?.*)?$) { return 301 $1; }

location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
}

