# Include inside the landing site's HTTPS server block.
# The NestJS backend and admin panel must use the same MongoDB database.
# Add the landing origin to backend ALLOWED_ORIGINS and trust only this proxy.
location = /api/public/leads {
    limit_except POST { deny all; }
    client_max_body_size 32k;
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Overwrite client-supplied values; NestJS trusts the loopback proxy.
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
}
