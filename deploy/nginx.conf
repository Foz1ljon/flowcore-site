# Landing site (flowcore.uz) behind Cloudflare. Installed by deploy/server-setup.sh as
# /etc/nginx/sites-available/flowcore.uz, replacing the old static-only block.
# Snippets: nginx-leads.conf → /etc/nginx/snippets/flowcore-leads.conf,
#           nginx-static.conf → /etc/nginx/snippets/flowcore-static.conf.
# Files are uploaded by .github/workflows/deploy.yml to /var/www/flowcore-site.

# Port 80 serves too: Cloudflare "Flexible" mode reaches the origin over HTTP.
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name flowcore.uz;

    root /var/www/flowcore-site;
    ssl_certificate /etc/ssl/flowcore/origin.pem;
    ssl_certificate_key /etc/ssl/flowcore/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Real client address from Cloudflare (https://www.cloudflare.com/ips/), so the
    # lead endpoint rate-limits visitors rather than Cloudflare edges.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Keep the public form route with the static site during every deployment.
    include /etc/nginx/snippets/flowcore-leads.conf;
    include /etc/nginx/snippets/flowcore-static.conf;
}

# One host for search engines.
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.flowcore.uz;

    ssl_certificate /etc/ssl/flowcore/origin.pem;
    ssl_certificate_key /etc/ssl/flowcore/origin.key;

    return 301 https://flowcore.uz$request_uri;
}
